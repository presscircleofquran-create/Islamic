<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04130F">
<title>বিভাগ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Amiri+Quran&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/islamic.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="p-body">
<main class="p-wrap" id="app"></main>
<script type="module">
import { db, collection, getDocs, getDoc, doc, query, where } from "./assets/firebase.js";
import { mountBg, mountNav, requireUser, touchUser, topHtml, setTop, btnHtml, loaderHtml, msgHtml, emptyHtml, ICON, qs, esc, toBn } from "./assets/app.js";

mountBg('section'); mountNav('home');
const app = document.getElementById('app');
document.body.insertAdjacentHTML('afterbegin', topHtml({ title: '...', back: 'index.html' }));
app.innerHTML = loaderHtml(3);
const user = await requireUser(); touchUser(user);
const hid = qs('h');
try {
  if (!hid) throw new Error('no id');
  const home = await getDoc(doc(db, 'home_buttons', hid));
  const name = home.exists() ? home.data().name : 'বিভাগ';
  document.title = name; setTop(name, '');
  const snap = await getDocs(query(collection(db, 'section_buttons'), where('homeId', '==', hid)));
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
  app.innerHTML = `<div class="p-pagehead"><span class="p-eyebrow">বিভাগ</span><h2>${esc(name)}</h2><p>${items.length ? toBn(items.length) + 'টি সেকশন' : ''}</p></div>` +
    (items.length ? `<div class="p-stack">${items.map((b, i) => btnHtml({ label: b.name, href: 'list.html?s=' + encodeURIComponent(b.id), i })).join('')}</div>`
      : emptyHtml(ICON.book, 'এখনো কিছু যোগ করা হয়নি'));
} catch (err) { console.error(err); app.innerHTML = msgHtml('ডেটা লোড করা যায়নি।', true); }
</script>
</body>
</html>
